name: Bootstrap Render Production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Create Production Web Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Bootstrap on Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          API=https://api.render.com/v1
          AUTH="Authorization: Bearer ${RENDER_API_KEY}"

          STAGING_ID="${{ secrets.RENDER_STAGING_SERVICE_ID }}"
          STAGING=$(curl -sS -H "$AUTH" -H "Accept: application/json" "$API/services/$STAGING_ID")
          OWNER_ID=$(echo "$STAGING" | jq -r '.ownerId')
          ENV_ID=$(echo "$STAGING" | jq -r '.environmentId')
          REGION=$(echo "$STAGING" | jq -r '.serviceDetails.region // "oregon"')
          echo "owner=$OWNER_ID env=$ENV_ID region=$REGION"

          # Free tier: only one Free Postgres per workspace. Reuse staging instance with a second database.
          PG_ID=$(curl -sS -H "$AUTH" -H "Accept: application/json" "$API/postgres?limit=50" \
            | jq -r '.[] | .postgres | select(.name=="items-api-db-staging") | .id' | head -1)
          echo "postgres_id=$PG_ID"
          test -n "$PG_ID" && test "$PG_ID" != "null"

          CONN=$(curl -sS -H "$AUTH" -H "Accept: application/json" "$API/postgres/$PG_ID/connection-info")
          EXTERNAL=$(echo "$CONN" | jq -r '.externalConnectionString')
          INTERNAL=$(echo "$CONN" | jq -r '.internalConnectionString')
          test -n "$EXTERNAL" && test "$EXTERNAL" != "null"

          sudo apt-get update -y >/dev/null
          sudo apt-get install -y postgresql-client >/dev/null
          if ! psql "$EXTERNAL" -tAc "SELECT 1 FROM pg_database WHERE datname='items_api_db_production'" | grep -q 1; then
            echo "Creating database items_api_db_production on shared Free Postgres…"
            psql "$EXTERNAL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE items_api_db_production;'
          else
            echo "Database items_api_db_production already exists"
          fi

          # Replace the database name segment before optional query string
          rewrite_db() {
            python3 -c 'import os,re,sys; u=os.environ["U"]; print(re.sub(r"/([^/?]+)(\?|$)", r"/items_api_db_production\2", u, count=1))'
          }
          PROD_EXTERNAL=$(U="$EXTERNAL" rewrite_db)
          PROD_INTERNAL=$(U="$INTERNAL" rewrite_db)
          echo "prod_db_url_ready"

          PROD_ID=$(curl -sS -H "$AUTH" -H "Accept: application/json" "$API/services?limit=50" \
            | jq -r '.[] | .service | select(.name=="items-api-production") | .id' | head -1)
          IMAGE_PATH="docker.io/${DOCKERHUB_USERNAME}/items-api:latest"

          if [ -z "$PROD_ID" ] || [ "$PROD_ID" = "null" ]; then
            echo "Creating Free Web Service items-api-production…"
            SVC_BODY=$(jq -n \
              --arg owner "$OWNER_ID" \
              --arg env "$ENV_ID" \
              --arg region "$REGION" \
              --arg image "$IMAGE_PATH" \
              '{
                type: "web_service",
                name: "items-api-production",
                ownerId: $owner,
                environmentId: $env,
                autoDeploy: "no",
                image: { ownerId: $owner, imagePath: $image },
                serviceDetails: {
                  runtime: "image",
                  plan: "free",
                  region: $region,
                  healthCheckPath: "/health",
                  preDeployCommand: "node ./node_modules/prisma/build/index.js migrate deploy",
                  envSpecificDetails: {
                    dockerCommand: "",
                    dockerContext: "",
                    dockerfilePath: "",
                    preDeployCommand: "node ./node_modules/prisma/build/index.js migrate deploy"
                  }
                }
              }')
            SVC_RESP=$(curl -sS -X POST "$API/services" \
              -H "$AUTH" -H "Accept: application/json" -H "Content-Type: application/json" \
              -d "$SVC_BODY")
            echo "$SVC_RESP" | jq '{id, name, url: .serviceDetails.url, message}' 2>/dev/null || echo "$SVC_RESP"
            PROD_ID=$(echo "$SVC_RESP" | jq -r '.id // empty')
            if [ -z "$PROD_ID" ]; then
              echo "Failed to create production service" >&2
              exit 1
            fi
          else
            echo "Reusing service_id=$PROD_ID"
          fi

          curl -sS -X PUT "$API/services/$PROD_ID/env-vars" \
            -H "$AUTH" -H "Accept: application/json" -H "Content-Type: application/json" \
            -d "[{\"key\":\"NODE_ENV\",\"value\":\"production\"},{\"key\":\"DATABASE_URL\",\"value\":$(echo "$PROD_INTERNAL" | jq -Rs .)}]" \
            | jq '[.[] | (.envVar.key // .key)]'

          echo "Applying Migrations to Production database…"
          npm ci
          DATABASE_URL="$PROD_EXTERNAL" npx prisma migrate deploy

          URL=$(curl -sS -H "$AUTH" -H "Accept: application/json" "$API/services/$PROD_ID" | jq -r '.serviceDetails.url')
          echo "PRODUCTION_SERVICE_ID=$PROD_ID" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "PRODUCTION_URL=$URL" | tee -a "$GITHUB_STEP_SUMMARY"
