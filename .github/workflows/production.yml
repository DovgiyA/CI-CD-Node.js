name: Production deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Immutable image tag (sha-…) or digest (sha256:…)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  IMAGE_NAME: items-api

jobs:
  deploy-production:
    name: Deploy production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image reference
        id: image
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ inputs.image_tag }}"
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-12)
            REF="sha-${SHORT_SHA}"
          fi

          case "$REF" in
            sha256:*)
              # Registry digest form: repo@sha256:…
              IMAGE="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}@$REF"
              ;;
            *)
              IMAGE="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:$REF"
              ;;
          esac

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Deploying $IMAGE"

      - name: Deploy Image to Render production
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_PRODUCTION_SERVICE_ID }}
          IMAGE_URL: ${{ steps.image.outputs.image }}
        run: sh scripts/render-deploy-image.sh
