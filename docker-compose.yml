services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: items
      POSTGRES_PASSWORD: items
      POSTGRES_DB: items
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U items -d items"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - items_pg:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://items:items@db:5432/items?schema=public
    depends_on:
      db:
        condition: service_healthy
    # Local-only migrate-then-start (ADR-0002 exception). Staging/Production use release_command.
    command: >
      sh -c "npm run prisma:migrate && node dist/index.js"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  items_pg:
