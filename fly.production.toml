# Production app on Fly.io.
# Create once: fly apps create items-api-production
# Attach DB:   fly postgres attach <pg-production-app> -a items-api-production

app = "items-api-production"
primary_region = "fra"

# Image always comes from CI: fly deploy --config fly.production.toml --image …/items-api:sha-… (or @sha256:…)
# Never pin Production to :latest (ADR-0003 / immutable tags).

[env]
  NODE_ENV = "production"
  PORT = "3000"

[deploy]
  release_command = "node ./node_modules/prisma/build/index.js migrate deploy"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
