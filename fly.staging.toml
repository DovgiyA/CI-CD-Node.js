# Staging app on Fly.io.
# Create once: fly apps create items-api-staging
# Attach DB:   fly postgres attach <pg-staging-app> -a items-api-staging
# Secrets:     fly secrets set DATABASE_URL=... -a items-api-staging  (usually set by attach)

app = "items-api-staging"
primary_region = "fra"

# Image always comes from CI: fly deploy --config fly.staging.toml --image …/items-api:sha-…
# Do not set [build].image — avoids accidental Deploy of :latest / a placeholder.

[env]
  NODE_ENV = "production"
  PORT = "3000"

[deploy]
  # No npm in the Image — call Prisma CLI via node (same as package.json prisma:migrate).
  release_command = "node ./node_modules/prisma/build/index.js migrate deploy"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
